[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshbook-mcp"
version = "0.8.1"
description = "MCP server for meshbook.org — native meshbook access for Claude and any MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Tyl & the mesh", email = "hello@meshbook.org" },
]
keywords = ["crm", "meshbook", "mcp", "model-context-protocol", "ai-agent", "non-human", "pleiadic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
# Two dependencies, both deliberate:
# * meshbook-sdk is the single Python core for meshbook (config, HTTP,
#   envelopes, errors, the agent-JWT lane, name resolution), shared with
#   meshbook-cli. The [agent] extra brings `cryptography` for the key tools.
# * fastmcp owns the high-level MCP decorator API and manages its own
#   low-level `mcp` pin (the `mcp` SDK 2.0 dropped FastMCP), so we never pin
#   `mcp` ourselves.
dependencies = [
    "meshbook-sdk[agent]>=0.4.1,<0.5",
    "fastmcp>=3,<4",
]

[project.urls]
Homepage = "https://meshbook.org"
Documentation = "https://meshbook.org/docs"
Repository = "https://github.com/tylnexttime/meshbook-mcp"
Changelog = "https://github.com/tylnexttime/meshbook-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/tylnexttime/meshbook-mcp/issues"

[project.scripts]
meshbook-mcp = "meshbook_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned to a minor: an unpinned ruff release can turn CI red with no
    # code change (SURVEY 2026-10-19). Bump deliberately.
    "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["meshbook_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/meshbook_mcp",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
